name: Release

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install frontend dependencies
        run: npm ci

      - name: Check Rust formatting
        run: cargo fmt --check

      - name: Run Clippy
        run: cargo clippy --workspace -- -D warnings

      - name: Check migration safety
        run: bash scripts/check-migrations.sh
        shell: bash

      - name: Run Rust tests
        run: cargo test --workspace

      - name: Run TypeScript type check
        run: npm run typecheck

      - name: Determine pre-release status
        id: prerelease
        shell: bash
        run: |
          TAG="${{ github.ref_name }}"
          if [[ "$TAG" == *-alpha* ]] || [[ "$TAG" == *-beta* ]]; then
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
            echo "label=Pre-release" >> "$GITHUB_OUTPUT"
          else
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
            echo "label=Release" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and release
        uses: tauri-apps/tauri-action@v0.5.25
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Pitwall ${{ github.ref_name }}'
          releaseBody: |
            ## Pitwall ${{ github.ref_name }} (${{ steps.prerelease.outputs.label }})

            See the changelog for details.
          releaseDraft: false
          prerelease: ${{ steps.prerelease.outputs.is_prerelease == 'true' }}
