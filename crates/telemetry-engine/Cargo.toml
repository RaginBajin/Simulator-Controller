[package]
name = "telemetry-engine"
version = "0.1.0"
edition = "2021"

[dependencies]
storage = { path = "../storage" }
arrow = { version = "57" }
tracing = "0.1"
chrono = "0.4"
uuid = { version = "1", features = ["v4"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.33"
crossbeam = "0.8"
tokio = { version = "1", features = ["rt", "time"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["full"] }
