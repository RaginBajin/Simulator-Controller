[package]
name = "pitwall"
version = "0.1.0"
description = "Your AI Race Engineer - telemetry analysis and coaching for sim racers"
authors = ["jbajin"]
edition = "2021"

[lib]
name = "pitwall_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
storage = { path = "../crates/storage" }
telemetry-engine = { path = "../crates/telemetry-engine" }
ai-provider = { path = "../crates/ai-provider" }

